# Mattermost - Homelab Configuration (chart 2.7.0 / appVersion 11.1.1)

global:
  siteUrl: "http://mattermost"

  features:
    database:
      driver: postgres
      # Uses secret reference instead of inline credentials
      existingDatabaseSecret:
        name: mattermost-postgres-secret
        key: DATABASE_URL

    fileStore:
      # Local storage for homelab — no S3 needed
      driver: local

    jobserver:
      enabled: false

mattermostApp:
  replicaCount: 1
  image:
    repository: mattermost/mattermost-enterprise-edition
    tag: 11.1.1
    pullPolicy: IfNotPresent

  strategy:
    type: Recreate
    rollingUpdate: null
  revisionHistoryLimit: 3

  service:
    name: mattermost-app
    type: ClusterIP
    externalPort: 8065
    internalPort: 8065

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
